name: ground

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ground
  cancel-in-progress: false

jobs:
  ground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore archive baseline from the data branch
        run: |
          git fetch origin data:refs/remotes/origin/data || true
          git checkout origin/data -- archive ground.json 2>/dev/null || echo "no data branch yet, starting fresh"
      - name: Read the ground
        run: node fetch-ground.mjs
      - name: Render share card
        run: |
          npm install --no-save canvas >/dev/null 2>&1 || true
          mkdir -p fonts
          curl -fsSL -o fonts/CormorantGaramond-Italic.ttf "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond-Italic%5Bwght%5D.ttf" || true
          curl -fsSL -o fonts/IBMPlexMono-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/ibmplexmono/IBMPlexMono-Regular.ttf" || true
          node og-card.mjs || echo "og card failed, continuing without it"
      - name: Publish to data branch (one commit, replaced hourly)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f ground.json archive/
          [ -f og.png ] && git add -f og.png || true
          git commit -m "ground: hourly measurement"
          git push -f origin HEAD:data
