name: ground

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ground
  cancel-in-progress: false

jobs:
  ground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the ground
        run: node fetch-ground.mjs
      - name: Commit ground.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ground.json
          git diff --cached --quiet || git commit -m "ground: hourly measurement"
          git pull --rebase origin main
          git push
